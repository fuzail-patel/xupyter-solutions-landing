<!DOCTYPE html>
<html>
<body style="font-family:sans-serif;max-width:560px;margin:0 auto;border:1px solid #eee;border-radius:12px;overflow:hidden;background:#fff;">
  <div style="padding:24px 28px;display:flex;justify-content:space-between;align-items:center;background:#050208;color:#fff;">
    <strong>Xupyter Systems</strong>
    <span style="background:#fff1f2;color:#9f1239;font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600;text-transform:uppercase;">Job Application</span>
  </div>
  <div style="padding:20px 28px;">
    <h2 style="font-size:20px;margin:0 0 6px;color:#050208;">New Candidate: {{name}}</h2>
    <p style="color:#666;font-size:13px;margin:0;">A new application has been received for the <strong>{{position}}</strong> role.</p>
  </div>
  <hr style="border:none;border-top:1px solid #eee;margin:0 28px;">
  <table style="width:100%;padding:16px 28px;border-spacing:0;">
    <tr><td style="padding:8px 0;color:#999;font-size:11px;text-transform:uppercase;width:110px;">Full Name</td><td style="font-size:13px;font-weight:500;color:#050208;">{{name}}</td></tr>
    <tr><td style="padding:8px 0;color:#999;font-size:11px;text-transform:uppercase;">Email</td><td style="font-size:13px;font-weight:500;color:#050208;">{{email}}</td></tr>
    <tr><td style="padding:8px 0;color:#999;font-size:11px;text-transform:uppercase;">Phone</td><td style="font-size:13px;font-weight:500;color:#050208;">{{phone}}</td></tr>
    <tr><td style="padding:8px 0;color:#999;font-size:11px;text-transform:uppercase;">Resume</td><td style="font-size:13px;"><a href="{{resume_url}}" target="_blank" style="color:#C0392B;font-weight:600;text-decoration:none;">View Resume (PDF) →</a></td></tr>
  </table>
  <div style="margin:0 28px;background:#f5f5f5;padding:14px;border-radius:8px;font-size:13px;color:#333;">
    <div style="color:#999;font-size:11px;text-transform:uppercase;margin-bottom:6px;">Cover Note</div>
    {{message}}
  </div>
  <div style="margin:16px 28px 24px;background:#fff7ed;padding:14px;border-radius:8px;color:#9a3412;font-size:12px;">
    This candidate is waiting for a response. You can reply directly to their email.
  </div>
</body>
</html>
